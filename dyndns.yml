---

- name: Dynamic DNS Update for Hetzner DNS
  hosts: "localhost"
  gather_facts: true
  vars_files:
    - vars/vars.yml
  tasks:
    - name: Assert that external IP Address is set
      ansible.builtin.assert:
        that: "{{ external_ip_address | length > 0 }}"
        fail_msg: "It seems that you haven't provided an external IP Address."
        success_msg: "IP Address provided. Proceeding."

    - name: Get Zone ID for {{ dns_zone }}
      ansible.builtin.uri:
        url: "https://api.hetzner.cloud/v1/zones?name={{ dns_zone }}"
        method: GET
        headers:
          Authorization: "Bearer {{ api_key }}"
      register: zone_id

    - name: Get all DNS Records for Zone {{ dns_zone }}
      ansible.builtin.uri:
        url: "https://api.hetzner.cloud/v1/zones/{{ zone_id.json.zones[0].id }}/rrsets"
        method: GET
        headers:
          Authorization: "Bearer {{ api_key }}"
      register: dns_records

    - name: Manage Record
      ansible.builtin.include_tasks: manage_record.yml
      loop: "{{ dyndns_names }}"
      loop_control:
        loop_var: dyndns_name
